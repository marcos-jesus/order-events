            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          master_item:
            key: 'pgsql.custom.query[{$PG.SESSION},,,,stats]'
        - uuid: '6a47571e23064ac998cd4b36555a4720'
          name: 'PG: database size'
          type: DEPENDENT
          key: pg.stats.db_size
          delay: '0'
