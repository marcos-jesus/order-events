# Cluster Kafka de 50 brokers + 3 controllers KRaft dedicados (teste de volumetria).
# Heap reduzido (256m) para caber em uma única máquina. Brokers no host: 10004..10053 (node id 4..53).
x-common: &common
  image: apache/kafka:3.8.0
x-env: &env
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_NUM_PARTITIONS: 50

services:
  controller-1:
    <<: *common
    container_name: c50-controller-1
    environment:
      <<: *env
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT

  controller-2:
    <<: *common
    container_name: c50-controller-2
    environment:
      <<: *env
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT

  controller-3:
